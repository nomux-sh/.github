# Reusable Buf CI for nomux repositories.
#
# The interface (file name and input names) is a contract. Read README.md
# before you change it.
name: Buf CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains `buf.yaml`.
        type: string
        default: .
      breaking-against:
        description: >-
          Value for `buf breaking --against`, relative to the working
          directory. If the value is empty, the breaking check does not run.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # One job for all checks. Each check takes seconds, and one job installs
  # buf only one time.
  buf:
    name: buf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The breaking check reads other commits, branches and tags.
          fetch-depth: ${{ inputs.breaking-against != '' && '0' || '1' }}
      - name: Install buf
        id: setup
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: buf format --diff --exit-code
      # actions/checkout creates remote-tracking branches only. Inputs such as
      # `.git#branch=main` need a local branch.
      - name: Create local branches for the breaking check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.breaking-against != '' }}
        run: |
          git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin |
            while read -r branch; do
              if [ "$branch" = "HEAD" ]; then
                continue
              fi
              if ! git show-ref --verify --quiet "refs/heads/$branch"; then
                git branch --quiet "$branch" "origin/$branch"
              fi
            done
      - name: buf breaking
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.breaking-against != '' }}
        env:
          BREAKING_AGAINST: ${{ inputs.breaking-against }}
        run: buf breaking --against "$BREAKING_AGAINST"
