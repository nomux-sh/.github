# Reusable DCO check for nomux repositories.
#
# Call this workflow from a `pull_request` event. It has no inputs.
# Each commit in the pull request must have a `Signed-off-by` trailer.
# Merge commits are skipped.
name: DCO

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require a pull request event
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::This workflow reads the pull request commits. Call it from a pull_request event."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: Check the Signed-off-by trailer of each commit
        run: |
          set -euo pipefail
          pattern='^.+ <[^<>@ ]+@[^<>@ ]+>$'
          total=0
          missing=0
          while read -r sha; do
            total=$((total + 1))
            trailers="$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly=true)' "$sha")"
            if grep -Eq "$pattern" <<<"$trailers"; then
              continue
            fi
            missing=$((missing + 1))
            echo "::error::Commit ${sha:0:12} has no valid Signed-off-by trailer."
            echo "  subject: $(git log -1 --format=%s "$sha")"
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          echo "Commits checked: $total. Commits without sign-off: $missing."
          if [ "$missing" -gt 0 ]; then
            echo "Add the trailer with: git commit --amend --signoff (one commit)"
            echo "or: git rebase --signoff $BASE_SHA (all commits). Then force-push."
            exit 1
          fi
