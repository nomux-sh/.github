name: Feature request
description: Propose a change or a new function.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        An architecture change needs an architecture decision record (ADR). Read the [contribution guide](https://github.com/nomux-sh/.github/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem that you want to solve. Describe who has the problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change that you propose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other solutions that you examined, and why they are not sufficient.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: More information
    validations:
      required: false
