name: Bug report
description: Report a problem in nomux.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a vulnerability here. Obey the [security policy](https://github.com/nomux-sh/.github/blob/main/SECURITY.md).
        Do not include secrets, tokens or private data in logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that shows the problem.
      placeholder: |
        1. Run `nomux ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the full error text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The output of `nomux --version`, or the commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and version, CPU architecture, terminal or client.
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the applicable log lines. Remove secrets first.
      render: text
    validations:
      required: false
